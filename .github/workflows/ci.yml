name: Application checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr libgl1 libglib2.0-0
      - run: python -m pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py test accounts certificates verification blockchain_app branding --verbosity 2
      - run: python tools/repository_audit.py
        env:
          DJANGO_SECRET_KEY: test-only-ci-secret-key
          SUPER_ADMIN_PASSWORD: test-only-ci-admin-password
