{% extends "base.html" %}
{% block title %}Admin Login{% endblock %}
{% block content %}
<div class="mx-auto portal-card p-4 p-md-5" style="max-width:560px;">
  <h1 class="h2 mb-2 fw-bold">Admin Login</h1>
  <p class="text-muted mb-4">Sign in to manage certificate uploads, reviews, and verification records.</p>

  <form method="post">
    {% csrf_token %}
    {% if form.errors %}
      <div class="alert alert-danger py-2 mb-3" role="alert">Invalid username or password.</div>
    {% endif %}

    <div class="mb-3">
      <label class="form-label">Username</label>
      <input class="form-control" type="text" name="username" value="{{ form.username.value|default:'' }}" autocomplete="username" required />
    </div>
    <div class="mb-4">
      <label class="form-label">Password</label>
      <input class="form-control" type="password" name="password" autocomplete="current-password" required />
    </div>

    {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}
    <button class="btn btn-dark w-100 py-2" type="submit">Continue</button>
  </form>
</div>
{% endblock %}
