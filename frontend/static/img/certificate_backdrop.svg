    <path d="M138 270l29 29 58-65" fill="none" stroke="#15803d" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="120" y="210" fill="#fff" font-family="Arial,sans-serif" font-size="76" font-weight="700">VerifyCerts</text>
  <text x="124" y="278" fill="#bae6fd" font-family="Arial,sans-serif" font-size="30">Certificate authenticity with verifiable evidence</text>
</svg>
