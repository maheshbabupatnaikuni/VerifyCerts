<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Certificate verification network</title>
  <desc id="desc">Abstract blue security network with a certificate and verification mark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07152f"/>
      <stop offset="0.55" stop-color="#123e78"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#67e8f9" stop-opacity=".6"/>
      <stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1240" cy="180" r="420" fill="url(#glow)"/>
  <g fill="none" stroke="#93c5fd" stroke-opacity=".22" stroke-width="2">
