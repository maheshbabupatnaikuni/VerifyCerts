version: '3.9'
services:
  web:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    command: gunicorn university_verify.wsgi:application --bind 0.0.0.0:8000 --workers 3
    volumes:
      - ..:/app
      - media_data:/app/runtime/media
    env_file:
      - ../.env
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-verifycerts}
      POSTGRES_USER: ${POSTGRES_USER:-verifycerts}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:1.27
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media_data:/app/runtime/media
    depends_on:
      - web

volumes:
  postgres_data:
  media_data:
